<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tutoriais de Bárbara Eichenberg.">
  <title>Tutoriais — Bárbara Eichenberg</title>
  <link rel="stylesheet" href="https://use.typekit.net/ndv3lae.css">
  <link rel="stylesheet" href="style.css?v=600">
</head>
<body>
  <!-- PLAYER DE MÚSICA -->
  <div class="music-player" id="musicPlayer">
    <img class="music-cover" id="musicCover" src="covers/miimaker.png" alt="">

    <div class="music-info">
      <span class="music-now">Você está ouvindo agora:</span>
      <span class="music-title" id="musicTitle">Mii Maker Editing Mii</span>
    </div>

    <div class="music-controls">
      <button class="music-control" id="musicPrev" type="button" aria-label="Música anterior">◀◀</button>
      <button class="music-control music-play" id="musicPlay" type="button" aria-label="Tocar ou pausar">▶</button>
      <button class="music-control" id="musicNext" type="button" aria-label="Próxima música">▶▶</button>
    </div>

    <button class="music-close" id="musicClose" type="button" aria-label="Minimizar player">×</button>
    <audio id="backgroundAudio" preload="auto" autoplay></audio>
  </div>

  <div class="music-player-mini is-hidden" id="musicPlayerMini" aria-label="Player de música minimizado">
    <button class="music-mini-control" id="musicMiniPrev" type="button" aria-label="Música anterior">◀◀</button>
    <button class="music-mini-control music-mini-play" id="musicMiniPlay" type="button" aria-label="Tocar ou pausar">▶</button>
    <button class="music-mini-control" id="musicMiniNext" type="button" aria-label="Próxima música">▶▶</button>
  </div>

  <div class="portfolio-page">
    <header class="site-header page-width">
      <nav aria-label="Navegação principal">
        <a href="index.html#projetos">Projetos</a>
        <a href="index.html#contato">Contato</a>
        <a href="tutoriais.html" aria-current="page">Tutoriais</a>
      </nav>
    </header>

    <main class="tutorials-placeholder page-width">
      <span class="section-eyebrow">TUTORIAIS</span>
      <h1>Em construção<span class="title-dot">.</span></h1>
      <p>Essa página vai ganhar conteúdo depois.</p>
      <a class="portfolio-button" href="index.html">Voltar ao portfólio</a>
    </main>
  </div>
  <script src="script.js?v=600"></script>
</body>
</html>
